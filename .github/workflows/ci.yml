name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Self-hosted Linux runner: the full gate on every push.
  # Pull requests from forks never run on the self-hosted runner.
  linux:
    name: test (self-hosted linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runner
        run: .github/scripts/ci-prepare.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Windows cross build on the self-hosted runner: catches compile and lint errors early.
  windows-cross:
    name: build (self-hosted, x86_64-pc-windows-gnu)
    needs: linux
    runs-on: [self-hosted, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runner
        run: .github/scripts/ci-prepare.sh x86_64-pc-windows-gnu
      - run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo build --workspace --all-targets --locked --target x86_64-pc-windows-gnu

  # Real macOS and Windows tests on GitHub-hosted runners, only for main and pull requests.
  hosted:
    name: test (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
