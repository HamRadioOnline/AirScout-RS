name: AUR nightly (airscout-rs-git)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aur-git
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Validate that main builds before refreshing
        run: cargo build --workspace --bins --release --locked
      - name: Render the git recipe
        run: python3 packaging/aur/render.py git HEAD . aur
      - name: Regenerate .SRCINFO in the digest-pinned Arch builder
        run: |
          set -euo pipefail
          builder=$(python3 - <<'PY'
          import json
          pin = json.load(open("packaging/tools.lock.json"))["aur-builder"]["linux-x86_64"]
          print(pin["url"] + "@" + pin["digest"])
          PY
          )
          docker run --rm -v "$PWD:/src" -w /src "$builder" bash -c '
            set -euo pipefail
            useradd -m builder
            cp -r /src/aur/airscout-rs-git /tmp/airscout-rs-git
            chown -R builder:builder /tmp/airscout-rs-git
            su builder -c "cd /tmp/airscout-rs-git && makepkg --printsrcinfo > .SRCINFO"
            cp /tmp/airscout-rs-git/.SRCINFO /src/aur/airscout-rs-git/.SRCINFO
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aur-git-recipe
          path: aur/airscout-rs-git/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aur-git-recipe
          path: aur/airscout-rs-git
      - name: Publish the refreshed recipe
        id: publish
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${AUR_SSH_PRIVATE_KEY:-}" ]]; then
            echo "AUR_SSH_PRIVATE_KEY is not configured; skipping nightly AUR refresh"
            printf 'published=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          packaging/aur/publish.sh aur/airscout-rs-git airscout-rs-git
