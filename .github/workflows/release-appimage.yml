name: AppImages

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: AppImage (${{ matrix.slug }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: linux-x86_64
            os: ubuntu-22.04
          - slug: linux-arm64
            os: ubuntu-22.04-arm
          - slug: linux-armhf
            os: ubuntu-22.04
            dockerfile: armhf
            deb_arch: armhf
          - slug: linux-i686
            os: ubuntu-22.04
            dockerfile: i686
            deb_arch: i386
    env:
      TAG: ${{ inputs.tag }}
      SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stage-${{ matrix.slug }}
          path: transport
      - name: Extract stage
        run: |
          mkdir stage
          tar -xzf transport/stage.tar.gz -C stage
          python3 -c 'import json, os; assert json.load(open("stage/stage.json"))["slug"] == os.environ["SLUG"]'
      - name: Package with Ubuntu target libraries
        if: ${{ !matrix.dockerfile }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libasound2-dev libayatana-appindicator3-dev libxdo-dev \
            libxkbcommon-x11-0 librsvg2-common
          packaging/appimage/build.sh stage "$TAG" package
      - name: Register armhf emulation
        if: matrix.slug == 'linux-armhf'
        run: packaging/cross/register-arm-emulation.sh arm
      - name: Package with Debian cross-build target libraries
        if: matrix.dockerfile
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          docker build --iidfile "$RUNNER_TEMP/cross-image" \
            --file "packaging/cross/$DOCKERFILE.Dockerfile" packaging/cross
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace \
            --env DEB_ARCH --env TAG --env DEBIAN_FRONTEND=noninteractive \
            "$(cat "$RUNNER_TEMP/cross-image")" bash -euc '
              apt-get update -qq
              apt-get install -y --no-install-recommends python3 file \
                "libxkbcommon-x11-0:$DEB_ARCH" "librsvg2-common:$DEB_ARCH"
              packaging/appimage/build.sh stage "$TAG" package
            '
      - name: Extract and exercise all AppImage dispatches in the target userspace
        run: |
          version=$(python3 -c 'import json; print(json.load(open("stage/stage.json"))["version"])')
          packaging/tests/hosted/verify-package.sh appimage "package/assets/AirScout-RS-$TAG-$SLUG.AppImage" "$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-appimage-${{ matrix.slug }}
          path: package/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
