# AirScout-RS Flatpak manifest.
#
# Built from the prebuilt Linux release binaries (see packaging/flatpak/stage.sh),
# against the Freedesktop Platform/SDK 25.08 (pinned by OSTree commit in
# packaging/tools.lock.json). The runtime already ships GTK 3, ALSA, cairo,
# pango, gdk-pixbuf, libxkbcommon and the graphics stack, so only the tray-icon
# support libraries that the runtime does not provide are bundled below:
# ayatana-appindicator (with its ayatana-ido / ayatana-indicator / dbusmenu
# dependencies) and libxdo, all pinned by source and SHA-256.
#
# Every bundled third-party library installs its license/copying files under
# /app/share/licenses/<module>/, and the checked-in
# packaging/flatpak/third-party-notices.txt (installed as
# /app/share/licenses/airscout-rs/third-party-notices.txt) lists each component's
# version, license, pinned URL and SHA-256 as the corresponding-source notice.
#
# The GUI desktop entry, hicolor icons, AppStream metadata and license files are
# copied from the shared packaging/linux, packaging/icons and packaging/flatpak
# assets by stage.sh into the `stage` directory that the airscout-rs module
# installs into /app.
app-id: io.github.hamradioonline.AirScoutRS
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: airscout

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=ipc
  - --share=network
  - --device=dri
  # Serial devices (CAT rig control, rotators over USB) are not granted by
  # default. Enable them for your user with:
  #   flatpak override --user --device=all io.github.hamradioonline.AirScoutRS
  # and make sure your account can reach the host device node (e.g. the dialout
  # or uucp group). `--device=all` is a documented opt-in, never a default here.

modules:
  - name: airscout-rs
    buildsystem: simple
    sources:
      - type: dir
        path: stage
    build-commands:
      - install -d /app/bin /app/share/licenses/airscout-rs
      - install -m 0755 bin/airscout bin/airscout-planeserver bin/airscout-cli bin/catcheck bin/elevation-tile-gen bin/maptile-gen /app/bin/
      - cp -a share/applications share/metainfo share/icons /app/share/
      - install -m 0644 README.md LICENSE NOTICE third-party-notices.txt /app/share/licenses/airscout-rs/

  # The five bundled tray/dependency libraries below each build in-tree so their
  # license files (COPYING/COPYING.LGPL/LICENSE/COPYRIGHT) are available next to
  # the build and can be installed under /app/share/licenses/<module>/.
  # The SDK has no valac, and AirScout-RS links only the C libraries, so the
  # tray stack is built without GObject introspection and Vala bindings.
  # ayatana-ido 0.9.3 requires both unconditionally; the checked-in patch adds
  # the ENABLE_INTROSPECTION switch (default ON) that the build turns off.
  - name: ayatana-ido
    buildsystem: cmake-ninja
    builddir: false
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_TESTS=OFF
      - -DENABLE_INTROSPECTION=OFF
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/ayatana-ido/archive/refs/tags/0.9.3.tar.gz
        sha256: 4df0a21dde4f6e41d2738c7944d1169836d844e5b65364d1897e93766fa93d58
      - type: patch
        path: patches/ayatana-ido-0.9.3-optional-introspection.patch
    post-install:
      - install -d /app/share/licenses/ayatana-ido
      - found=0; for f in COPYING* LICENSE* COPYRIGHT*; do [ -f "$f" ] && install -m 0644 "$f" /app/share/licenses/ayatana-ido/ && found=1; done; [ "$found" = 1 ]

  # Build-only tool for dbusmenu's translations. `cleanup: ['*']` drops
  # everything it installs, so nothing from intltool ships in the Flatpak.
  - name: intltool
    buildsystem: autotools
    cleanup:
      - "*"
    sources:
      - type: archive
        url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
        sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd
      - type: patch
        path: patches/intltool-0.51.0-perl5.26-regex-fixes.patch

  - name: dbusmenu
    buildsystem: autotools
    builddir: false
    build-options:
      # libdbusmenu 16.04 builds with -Werror and uses GLib APIs deprecated
      # since 2.58.
      cflags: -Wno-error
    config-opts:
      - --with-gtk=3
      - --disable-dumper
      - --disable-static
      - --enable-introspection=no
      - --disable-vala
      - --disable-gtk-doc
    sources:
      - type: archive
        url: https://launchpad.net/dbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a
    post-install:
      - install -d /app/share/licenses/dbusmenu
      - found=0; for f in COPYING* LICENSE* COPYRIGHT*; do [ -f "$f" ] && install -m 0644 "$f" /app/share/licenses/dbusmenu/ && found=1; done; [ "$found" = 1 ]

  - name: libayatana-indicator
    buildsystem: cmake-ninja
    builddir: false
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/libayatana-indicator/archive/refs/tags/0.9.4.tar.gz
        sha256: a18d3c682e29afd77db24366f8475b26bda22b0e16ff569a2ec71cd6eb4eac95
    post-install:
      - install -d /app/share/licenses/libayatana-indicator
      - found=0; for f in COPYING* LICENSE* COPYRIGHT*; do [ -f "$f" ] && install -m 0644 "$f" /app/share/licenses/libayatana-indicator/ && found=1; done; [ "$found" = 1 ]

  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    builddir: false
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_TESTS=OFF
      - -DENABLE_GTKDOC=OFF
      - -DENABLE_BINDINGS_MONO=OFF
      - -DENABLE_BINDINGS_VALA=OFF
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/libayatana-appindicator/archive/refs/tags/0.5.93.tar.gz
        sha256: cbefed7a918a227bf71286246e237fcd3a9c8499b3eaac4897811a869409edf0
    post-install:
      - install -d /app/share/licenses/libayatana-appindicator
      - found=0; for f in COPYING* LICENSE* COPYRIGHT*; do [ -f "$f" ] && install -m 0644 "$f" /app/share/licenses/libayatana-appindicator/ && found=1; done; [ "$found" = 1 ]

  - name: xdotool
    buildsystem: simple
    builddir: false
    build-commands:
      - make
      - make install PREFIX=/app
    sources:
      - type: archive
        url: https://github.com/jordansissel/xdotool/archive/refs/tags/v3.20160805.1.tar.gz
        sha256: ddafca1239075c203769c17a5a184587731e56fbe0438c09d08f8af1704e117a
    post-install:
      - install -d /app/share/licenses/xdotool
      - found=0; for f in COPYING* LICENSE* COPYRIGHT*; do [ -f "$f" ] && install -m 0644 "$f" /app/share/licenses/xdotool/ && found=1; done; [ "$found" = 1 ]
